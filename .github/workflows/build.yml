name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython==0.29.33
    
    - name: Accept all Android licenses
      run: |
        mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
        cd "$HOME/.buildozer/android/platform/android-sdk/licenses"
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > android-sdk-license
        cp android-sdk-license android-sdk-preview-license
    
    - name: Build APK
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: stockflow-apk
        path: bin/*.apk
