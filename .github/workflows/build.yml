name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install buildozer cython==0.29.33
    
    - name: Build APK
      run: |
        buildozer android debug
    
    - name: Check APK exists
      run: |
        echo "=== FILES IN BIN ==="
        ls -la bin/ || echo "No bin directory"
        echo "=== SEARCHING FOR APK ==="
        find . -name "*.apk" -type f || echo "No APK found"
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stockflow-apk
        path: |
          bin/*.apk
          *.apk
